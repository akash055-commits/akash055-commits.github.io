name: Update LinkedIn Posts

# Runs daily at 7 AM IST (1:30 AM UTC). Also triggerable manually from the Actions tab.
#
# SETUP (one-time — until this is done the job is a deliberate no-op):
#   1. Go to https://rss.app and create a free feed from your LinkedIn profile URL.
#   2. Copy the RSS feed URL (e.g. https://rss.app/feeds/xxxxxxxxx.xml).
#   3. gh secret set LINKEDIN_RSS_URL --repo akash055-commits/akash055-commits.github.io
#   4. Run the workflow manually once to confirm posts.json fills with real permalinks.
#
# Until the secret exists, posts.json stays empty and the Writing section hides itself.
# Never hand-write posts into posts.json — engagement counts and dates that don't match
# the real LinkedIn profile are worse than an absent section.

on:
  schedule:
    - cron: '30 1 * * *'   # Daily at 7 AM IST as a fallback
  workflow_dispatch:        # Manual trigger from Actions tab
  repository_dispatch:      # Zapier triggers this via GitHub API
    types: [linkedin-post]

jobs:
  update-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch & parse RSS
        env:
          RSS_URL: ${{ secrets.LINKEDIN_RSS_URL }}
        run: |
          if [ -z "$RSS_URL" ]; then
            echo "LINKEDIN_RSS_URL secret not set — skipping update."
            exit 0
          fi

          curl -sSL --fail --retry 3 "$RSS_URL" -o feed.xml || {
            echo "::warning::Feed fetch failed — leaving posts.json untouched."
            exit 0
          }

          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import json, re, sys
          from datetime import datetime, timezone

          ATOM = '{http://www.w3.org/2005/Atom}'

          try:
              root = ET.parse('feed.xml').getroot()
          except ET.ParseError as e:
              print(f"::warning::Feed did not parse ({e}) — leaving posts.json untouched.")
              sys.exit(0)

          items = root.findall('.//item') or root.findall(f'.//{ATOM}entry')

          def text(item, *tags):
              for tag in tags:
                  el = item.find(tag)
                  if el is not None and el.text and el.text.strip():
                      return el.text.strip()
              return ''

          def link_of(item):
              # RSS 2.0 puts the URL in <link> element text; Atom puts it in <link href="...">.
              el = item.find('link')
              if el is not None and el.text and el.text.strip():
                  return el.text.strip()
              for el in item.findall(f'{ATOM}link'):
                  rel = el.get('rel', 'alternate')
                  if rel == 'alternate' and el.get('href'):
                      return el.get('href').strip()
              return text(item, f'{ATOM}id')

          posts = []
          for item in items[:6]:
              title   = text(item, 'title', f'{ATOM}title')
              pubdate = text(item, 'pubDate', f'{ATOM}published', f'{ATOM}updated')
              desc    = text(item, 'description', f'{ATOM}summary', f'{ATOM}content') or title

              content = re.sub(r'<[^>]+>', '', desc).strip()
              for entity, char in (('&amp;', '&'), ('&lt;', '<'), ('&gt;', '>'), ('&nbsp;', ' '), ('&#39;', "'"), ('&quot;', '"')):
                  content = content.replace(entity, char)
              content = re.sub(r'\n{3,}', '\n\n', content).strip()

              url = link_of(item)
              if not content or not url:
                  continue

              friendly = ''
              for fmt in ('%a, %d %b %Y', '%Y-%m-%d'):
                  try:
                      friendly = datetime.strptime(pubdate[:16].strip() if fmt.startswith('%a') else pubdate[:10], fmt).strftime('%b %-d, %Y')
                      break
                  except Exception:
                      continue
              if not friendly:
                  friendly = pubdate[:10]

              # Engagement is not available from RSS. Left at 0 so the template hides it —
              # never populate these by hand.
              posts.append({
                  'date': friendly,
                  'content': content[:500],
                  'likes': 0,
                  'comments': 0,
                  'url': url,
              })

          # Guard: an empty parse means the feed broke, not that he stopped posting.
          # Overwriting here would silently wipe the section.
          if not posts:
              print("::warning::Parsed 0 posts — leaving posts.json untouched.")
              sys.exit(0)

          with open('posts.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'lastUpdated': datetime.now(timezone.utc).strftime('%Y-%m-%d'),
                  'posts': posts,
              }, f, indent=2, ensure_ascii=False)

          print(f"Wrote {len(posts)} posts.")
          EOF

      - name: Commit updated posts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update LinkedIn posts [skip ci]"
            git push
          fi
